<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#030911"><title>Admin Control Centre | SkyShotConner Canvas</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="site-overrides.css"><style>
.admin-page{padding-bottom:80px}.admin-top{margin-top:35px;padding:28px;border-radius:24px}.admin-top h1{margin:3px 0 5px}.admin-tabs{display:flex;gap:8px;overflow:auto;padding:18px 0}.admin-tab{border:1px solid var(--line);border-radius:12px;padding:11px 16px;background:rgba(255,255,255,.035);color:#9db5c2;font-weight:850;white-space:nowrap}.admin-tab.active{background:linear-gradient(135deg,rgba(99,215,255,.18),rgba(154,124,255,.16));color:#eafaff;border-color:rgba(99,215,255,.4)}.admin-section{display:none}.admin-section.active{display:block}.admin-top,.admin-panel,.admin-order,.admin-empty,.admin-stat{background:linear-gradient(145deg,rgba(12,30,47,.82),rgba(4,12,21,.76));border:1px solid rgba(99,215,255,.14);box-shadow:0 20px 55px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.035)}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:25px}.admin-actions{display:flex;gap:9px}.admin-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.admin-stat{padding:20px;border-radius:18px}.admin-stat strong{display:block;font-size:1.8rem;color:#eaf8fc}.admin-stat span{color:#819daa;font-size:.78rem}.admin-panel{padding:22px;border-radius:20px;margin-top:18px}.admin-panel h2,.admin-panel h3{margin-top:0;color:#eaf8fc}.section-head{margin-top:12px}.product-admin-card{display:grid;grid-template-columns:220px 1fr auto;gap:20px;align-items:center;padding:16px;border:1px solid rgba(99,215,255,.12);border-radius:18px;background:rgba(255,255,255,.025);margin-bottom:10px}.product-admin-card:hover{border-color:rgba(99,215,255,.3)}.admin-product-image{width:220px;aspect-ratio:16/9;border-radius:13px;overflow:hidden;background:#071725}.admin-product-image img{width:100%;height:100%;object-fit:cover}.product-admin-card .details h3{margin:0 0 7px;color:#eaf8fc}.admin-product-badges{display:flex;flex-wrap:wrap;gap:7px}.admin-badge{font-size:.62rem;letter-spacing:.08em;font-weight:900;padding:5px 8px;border-radius:99px;background:rgba(99,215,255,.08);color:#a9eaff}.admin-badge.good{color:#65e6b2}.admin-badge.warn{color:#ffcf72}.admin-badge.off{color:#ff9ba6}.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:13px}.detail-grid div{padding:9px;border:1px solid rgba(99,215,255,.08);border-radius:10px;background:rgba(0,0,0,.12)}.detail-grid small{display:block;color:#6f8998;font-size:.6rem;text-transform:uppercase;letter-spacing:.08em}.detail-grid strong{font-size:.82rem;color:#dceff6}.product-admin-actions{display:flex;flex-direction:column;gap:8px}.admin-order{padding:20px;border-radius:18px;margin-bottom:12px}.admin-order-head{display:flex;justify-content:space-between;gap:15px;align-items:start}.admin-order h3{margin:0}.admin-order-meta{color:#819daa;font-size:.8rem}.admin-order-grid{display:grid;grid-template-columns:1.4fr .6fr;gap:20px;margin-top:16px;padding-top:15px;border-top:1px solid var(--line)}.admin-order-items{border-top:1px solid var(--line);margin-top:15px;padding-top:10px}.order-item-line{display:flex;justify-content:space-between;gap:15px;padding:7px 0;color:#c6dce6}.admin-status-select{background:#081725;color:#a9eaff;border:1px solid rgba(99,215,255,.18);border-radius:10px;padding:9px}.admin-customer-row{display:grid;grid-template-columns:1.4fr 1fr 130px;gap:15px;padding:14px;border-bottom:1px solid var(--line)}.admin-customer-row strong{color:#eaf8fc}.admin-customer-row span{color:#819daa;font-size:.8rem}.admin-collection-row{display:grid;grid-template-columns:1fr 120px auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.admin-form{display:grid;gap:12px}.admin-form label{color:#cfe4ed;font-weight:750;font-size:.84rem}.admin-form input,.admin-form textarea,.admin-form select{width:100%;margin-top:7px;padding:12px 13px;border:1px solid rgba(99,215,255,.14);border-radius:11px;background:rgba(255,255,255,.045);color:#eaf7fc;outline:none}.admin-form input:focus,.admin-form textarea:focus,.admin-form select:focus{border-color:rgba(99,215,255,.5);box-shadow:0 0 0 3px rgba(99,215,255,.06)}.admin-checks{display:flex;gap:20px;flex-wrap:wrap}.admin-check{display:flex!important;align-items:center;gap:8px}.admin-check input{width:auto!important;margin:0!important;accent-color:#63d7ff}.admin-note{padding:12px;border:1px solid rgba(99,215,255,.1);border-radius:11px;background:rgba(99,215,255,.04);color:#8fb4c2;font-size:.8rem}.modal-backdrop{display:none;position:fixed;inset:0;z-index:100;place-items:center;padding:18px;background:rgba(1,6,12,.8);backdrop-filter:blur(12px)}.admin-modal{width:min(850px,100%);max-height:92vh;overflow:auto;padding:24px;border-radius:22px;background:linear-gradient(145deg,#0b1d2d,#050d16);border:1px solid rgba(99,215,255,.2);box-shadow:0 30px 100px rgba(0,0,0,.55)}.admin-modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.admin-modal-head h2{margin:0;color:#f2fbff}.icon-close{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:#fff;font-size:1.4rem}.image-preview{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.image-preview figure{margin:0}.image-preview img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;border:1px solid rgba(99,215,255,.12)}.image-actions{display:flex;gap:5px;margin-top:5px}.image-actions button{font-size:.68rem;padding:5px 7px;border-radius:7px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#bfeaf7}.variant-editor{display:grid;gap:8px}.variant-row{display:grid;grid-template-columns:1.4fr .8fr .7fr auto;gap:8px;align-items:end;padding:10px;border:1px solid rgba(99,215,255,.1);border-radius:11px}.variant-row input{margin-top:0}.toast{z-index:200}.admin-search{display:flex;gap:10px;margin-bottom:15px}.admin-search input{flex:1;padding:12px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.04);color:#fff}
@media(max-width:900px){.admin-stats{grid-template-columns:repeat(2,1fr)}.admin-top{flex-direction:column;align-items:stretch}.admin-actions .btn{flex:1}.product-admin-card{grid-template-columns:150px 1fr}.admin-product-image{width:150px}.product-admin-actions{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}.detail-grid{grid-template-columns:repeat(2,1fr)}.admin-order-grid{grid-template-columns:1fr}.admin-customer-row{grid-template-columns:1fr 1fr}.variant-row{grid-template-columns:1fr 1fr}}

<div class="modal-backdrop" id="productModal"><div class="admin-modal"><div class="admin-modal-head"><h2 id="modalTitle">Add product</h2><button class="icon-close" id="closeModal" type="button">×</button></div><form class="admin-form" id="productForm"><input type="hidden" id="productId"><label>Product name<input required id="productName" placeholder="e.g. Harvard Formation"></label><label>Short description<input id="productShort"></label><label>Full description<textarea id="productDescription" rows="5"></textarea></label><div class="form-grid-2"><label>Price (R)<input required min="0" step="0.01" type="number" id="productPrice"></label><label>Compare price (R)<input min="0" step="0.01" type="number" id="productCompare"></label></div><div class="form-grid-2"><label>Stock<input required min="0" type="number" id="productStock" value="0"></label><label>SKU<input id="productSku" placeholder="SSC-001"></label></div><label>Collection<select id="productCategory"></select></label><div class="admin-checks"><label class="admin-check"><input type="checkbox" id="productActive" checked> Visible in shop</label><label class="admin-check"><input type="checkbox" id="productFeatured"> Featured product</label></div><label>Product images<input type="file" id="productFiles" accept="image/jpeg,image/png,image/webp" multiple><small class="admin-meta">16:9 images are displayed without stretching. Existing images can be deleted or made primary.</small></label><div class="image-preview" id="imagePreview"></div><label>Variants / sizes <small class="admin-meta">Optional</small></label><div id="variantEditor" class="variant-editor"></div><button class="btn btn-outline btn-small" id="addVariant" type="button">＋ Add variant</button><div class="admin-note">Changes are saved directly to Supabase. Shipping is fixed at R95 nationwide via Courier Guy.</div><button class="btn btn-primary btn-wide" id="saveProduct" type="submit">Save product</button><p class="form-msg" id="productMsg"></p></form></div></div>
<div class="modal-backdrop" id="categoryModal"><div class="admin-modal" style="max-width:560px"><div class="admin-modal-head"><h2>Collection</h2><button class="icon-close" id="closeCategory" type="button">×</button></div><form class="admin-form" id="categoryForm"><input type="hidden" id="categoryId"><label>Collection name<input required id="categoryName"></label><label>Description<textarea id="categoryDescription" rows="3"></textarea></label><label>Sort order<input id="categorySort" type="number" value="0"></label><label class="admin-check"><input id="categoryActive" type="checkbox" checked> Visible</label><button class="btn btn-primary btn-wide">Save collection</button><p id="categoryMsg" class="form-msg"></p></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient('https://xdkoutuetajwzwrjzehw.supabase.co','sb_publishable_K0r7cxL94PMJ5S0HM8aKfQ_cc73t2hu',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>`R ${Number(v||0).toLocaleString('en-ZA',{minimumFractionDigits:2})}`,img=p=>p?db.storage.from('product-images').getPublicUrl(p).data.publicUrl:'';let products=[],categories=[],orders=[],items=[],customers=[];
function toast(t){const x=$('.toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}function setup(){const b=$('.menu-toggle'),n=$('.main-nav');if(b)b.onclick=()=>n.classList.toggle('open');$('#year').textContent=new Date().getFullYear();const c=JSON.parse(localStorage.getItem('ssc_canvas_cart')||'[]');$('#cartCount').textContent=c.reduce((s,i)=>s+Number(i.qty||1),0)}
async function boot(){setup();const {data:{user}}=await db.auth.getUser();if(!user){deny('Admin sign-in required','Sign in with your administrator account.','account.html');return}const {data:isAdmin,error}=await db.rpc('is_admin');if(error||!isAdmin){deny('Access denied','This account is not an administrator.','index.html');return}try{await loadData();render()}catch(e){console.error(e);deny('Dashboard could not load',e.message||'Please refresh.','index.html')}}function deny(h,p,href){$('#adminApp').innerHTML=`<div class="admin-empty" style="padding:60px;text-align:center;border-radius:22px"><h2>${esc(h)}</h2><p>${esc(p)}</p><a class="btn btn-primary" href="${href}">Continue</a></div>`}
async function loadData(){const [cr,pr,or,oi,cu]=await Promise.all([db.from('categories').select('*').order('sort_order'),db.from('products').select('*,categories(name),product_images(*),product_variants(*)').order('created_at',{ascending:false}),db.from('orders').select('*').order('created_at',{ascending:false}),db.from('order_items').select('*'),db.from('profiles').select('*').order('created_at',{ascending:false})]);for(const r of [cr,pr,or,oi,cu])if(r.error)throw r.error;categories=cr.data||[];products=pr.data||[];orders=or.data||[];items=oi.data||[];customers=cu.data||[]}
function render(){const active=products.filter(p=>p.is_active),low=active.filter(p=>Number(p.stock)<=3),open=orders.filter(o=>!['completed','cancelled'].includes(o.status)),paid=orders.filter(o=>o.payment_status==='paid').reduce((s,o)=>s+Number(o.total||0),0);$('#adminApp').innerHTML=`<div class="admin-top"><div><span class="eyebrow">STORE CONTROL CENTRE</span><h1>SkyShotConner Canvas</h1><p>Products · Orders · Customers · Collections · Store settings</p></div><div class="admin-actions"><a class="btn btn-outline" href="index.html">View store</a><button class="btn btn-outline" id="logout">Sign out</button></div></div><div class="admin-tabs"><button class="admin-tab active" data-tab="overview">Overview</button><button class="admin-tab" data-tab="products">Products</button><button class="admin-tab" data-tab="orders">Orders</button><button class="admin-tab" data-tab="customers">Customers</button><button class="admin-tab" data-tab="categories">Collections</button><button class="admin-tab" data-tab="settings">Store settings</button></div><section id="tab-overview" class="admin-section active"></section><section id="tab-products" class="admin-section"></section><section id="tab-orders" class="admin-section"></section><section id="tab-customers" class="admin-section"></section><section id="tab-categories" class="admin-section"></section><section id="tab-settings" class="admin-section"></section>`;$$('.admin-tab').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));$('#logout').onclick=async()=>{await db.auth.signOut();location.href='login.html'};renderOverview();renderProducts();renderOrders();renderCustomers();renderCategories();renderSettings()}
function showTab(t){$$('.admin-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));$$('.admin-section').forEach(s=>s.classList.toggle('active',s.id==='tab-'+t))}
function renderOverview(){$('#tab-overview').innerHTML=`<div class="admin-stats"><div class="admin-stat"><strong>${products.filter(p=>p.is_active).length}</strong><span>Active products</span></div><div class="admin-stat"><strong>${lowStock()}</strong><span>Low stock</span></div><div class="admin-stat"><strong>${orders.filter(o=>!['completed','cancelled'].includes(o.status)).length}</strong><span>Open orders</span></div><div class="admin-stat"><strong>${money(paidRevenue())}</strong><span>Paid revenue</span></div></div><div class="admin-control-grid"><div class="control-card"><strong>${customers.length}</strong><span>Customer profiles</span></div><div class="control-card"><strong>${categories.filter(c=>c.is_active).length}</strong><span>Live collections</span></div><div class="control-card"><strong>${products.filter(p=>!p.is_active).length}</strong><span>Hidden products</span></div><div class="control-card"><strong>${money(95)}</strong><span>Courier Guy nationwide</span></div></div><div class="admin-panel"><span class="eyebrow">QUICK ACTIONS</span><h2>Manage the store</h2><div class="actions"><button class="btn btn-primary" onclick="openProduct()">＋ Add product</button><button class="btn btn-outline" onclick="showTab('categories')">Manage collections</button><button class="btn btn-outline" onclick="showTab('orders')">Manage orders</button><button class="btn btn-outline" onclick="showTab('customers')">View customers</button></div></div>`}function lowStock(){return products.filter(p=>p.is_active&&Number(p.stock)<=3).length}function paidRevenue(){return orders.filter(o=>o.payment_status==='paid').reduce((s,o)=>s+Number(o.total||0),0)}
function primary(p){const a=(p.product_images||[]).find(x=>x.is_primary)||(p.product_images||[])[0];return img(a?.storage_path)}function renderProducts(){const a=products.filter(p=>p.is_active),h=products.filter(p=>!p.is_active);$('#tab-products').innerHTML=`<div class="section-head"><div><span class="eyebrow">CATALOGUE CONTROL</span><h2>Products</h2><p>Every product, image, price, stock level, SKU, collection and variant is editable here.</p></div><button class="btn btn-primary" onclick="openProduct()">＋ Add product</button></div><div class="admin-search"><input id="adminProductSearch" placeholder="Search products, SKU or collection…"></div><div id="productList">${a.map(productCard).join('')||'<div class="admin-empty" style="padding:35px">No active products.</div>'}</div>${h.length?`<div class="admin-panel"><h3>Hidden products</h3>${h.map(productCard).join('')}</div>`:''}`;$('#adminProductSearch').oninput=e=>filterProducts(e.target.value)}function filterProducts(q){q=q.toLowerCase();$$('.product-admin-card').forEach(c=>c.style.display=c.textContent.toLowerCase().includes(q)?'grid':'none')}
function productCard(p){const u=primary(p),vars=p.product_variants||[],ims=p.product_images||[];return `<article class="product-admin-card"><div class="admin-product-image">${u?`<img src="${esc(u)}" alt="${esc(p.name)}">`:'✈'}</div><div class="details"><h3>${esc(p.name)}</h3><div class="admin-product-badges"><span class="admin-badge">${esc(p.categories?.name||'Uncategorised')}</span>${p.is_featured?'<span class="admin-badge good">FEATURED</span>':''}<span class="admin-badge ${Number(p.stock)>3?'good':'warn'}">${Number(p.stock)} IN STOCK</span>${!p.is_active?'<span class="admin-badge off">HIDDEN</span>':''}</div><div class="detail-grid"><div><small>Price</small><strong>${money(p.price)}</strong></div><div><small>SKU</small><strong>${esc(p.sku||'—')}</strong></div><div><small>Images</small><strong>${ims.length}</strong></div><div><small>Variants</small><strong>${vars.length}</strong></div></div></div><div class="product-admin-actions"><button class="btn btn-outline btn-small" onclick="openProduct('${p.id}')">Edit product</button>${p.is_active?`<button class="btn danger btn-small" onclick="toggleProduct('${p.id}',false)">Hide</button>`:`<button class="btn btn-primary btn-small" onclick="toggleProduct('${p.id}',true)">Restore</button>`}</div></article>`}
async function toggleProduct(id,active){const r=await db.from('products').update({is_active:active,updated_at:new Date().toISOString()}).eq('id',id);if(r.error){toast(r.error.message);return}await loadData();renderProducts();renderOverview();toast(active?'Product restored':'Product hidden')}
function renderOrders(){$('#tab-orders').innerHTML=`<div class="section-head"><div><span class="eyebrow">ORDER CONTROL</span><h2>Customer orders</h2><p>Review delivery details, products, totals and update order status.</p></div></div><div class="admin-orders">${orders.length?orders.map(orderCard).join(''):'<div class="admin-empty" style="padding:35px">No orders yet.</div>'}</div>`}function orderCard(o){const oi=items.filter(i=>i.order_id===o.id);const addr=o.shipping_address||{};return `<article class="admin-order"><div class="admin-order-head"><div><h3>#${o.id.slice(0,8).toUpperCase()}</h3><div class="admin-order-meta">${esc(o.customer_name||'Customer')} · ${esc(o.customer_email||'')} · ${new Date(o.created_at).toLocaleString('en-ZA')}</div></div><select class="admin-status-select" onchange="updateOrder('${o.id}',this.value)">${['pending','processing','shipped','completed','cancelled'].map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="admin-order-grid"><div><strong>Delivery</strong><p class="admin-order-meta">${esc(addr.address||'')} · ${esc(addr.city||'')} · ${esc(addr.province||'')} · ${esc(addr.postal_code||'')}<br>Courier Guy nationwide · R95</p></div><div><strong>Total</strong><p>${money(o.total)}<br><span class="admin-order-meta">Subtotal ${money(o.subtotal)} + Shipping ${money(o.shipping)}</span></p></div></div><div class="admin-order-items"><strong>Items</strong>${oi.map(i=>`<div class="order-item-line"><span>${esc(i.product_name)} × ${i.quantity}</span><strong>${money(i.line_total)}</strong></div>`).join('')}</div></article>`}async function updateOrder(id,status){const r=await db.from('orders').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(r.error){toast(r.error.message);return}const o=orders.find(x=>x.id===id);if(o)o.status=status;renderOrders();renderOverview();toast('Order updated')}
function renderCustomers(){$('#tab-customers').innerHTML=`<div class="section-head"><div><span class="eyebrow">CUSTOMER CONTROL</span><h2>Customers</h2><p>Registered customer profiles. Authentication credentials remain protected by Supabase Auth.</p></div></div><div class="admin-panel">${customers.length?customers.map(c=>`<div class="admin-customer-row"><div><strong>${esc(c.full_name||'Unnamed customer')}</strong><span>${esc(c.phone||'No phone number')}</span></div><span>Joined ${c.created_at?new Date(c.created_at).toLocaleDateString('en-ZA'):'—'}</span><span>Profile active</span></div>`).join(''):'<div class="admin-empty">No customer profiles yet.</div>'}</div>`}
function renderCategories(){$('#tab-categories').innerHTML=`<div class="section-head"><div><span class="eyebrow">COLLECTION CONTROL</span><h2>Collections</h2><p>Create, edit, hide and reorder product collections.</p></div><button class="btn btn-primary" onclick="openCategory()">＋ Add collection</button></div><div class="admin-panel">${categories.map(c=>`<div class="admin-collection-row"><div><strong>${esc(c.name)}</strong><div class="admin-meta">${esc(c.description||'No description')}</div></div><span class="admin-badge ${c.is_active?'good':'off'}">${c.is_active?'VISIBLE':'HIDDEN'}</span><button class="btn btn-outline btn-small" onclick="openCategory('${c.id}')">Edit</button></div>`).join('')||'<p>No collections yet.</p>'}</div>`}
function renderSettings(){$('#tab-settings').innerHTML=`<div class="section-head"><div><span class="eyebrow">STORE SETTINGS</span><h2>Shipping & store rules</h2></div></div><div class="admin-panel"><div class="shipping-callout"><strong>Courier Guy nationwide delivery</strong><span>R95.00 flat rate</span></div><p class="admin-meta">The R95 nationwide shipping price is enforced server-side when an authenticated customer places an order. Customers cannot change or remove it from the browser.</p><div class="detail-grid"><div><small>Courier</small><strong>Courier Guy</strong></div><div><small>Coverage</small><strong>Nationwide</strong></div><div><small>Rate</small><strong>R95.00</strong></div><div><small>Checkout</small><strong>Account required</strong></div></div></div>`}
function fillCats(){const s=$('#productCategory');s.innerHTML='<option value="">Uncategorised</option>'+categories.filter(c=>c.is_active!==false).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}
function openProduct(id=''){fillCats();const p=id?products.find(x=>x.id===id):null;$('#modalTitle').textContent=p?'Edit product':'Add product';$('#productId').value=p?.id||'';$('#productName').value=p?.name||'';$('#productShort').value=p?.short_description||'';$('#productDescription').value=p?.description||'';$('#productPrice').value=p?.price??'';$('#productCompare').value=p?.compare_at_price??'';$('#productStock').value=p?.stock??0;$('#productSku').value=p?.sku||'';$('#productCategory').value=p?.category_id||'';$('#productActive').checked=p?p.is_active:true;$('#productFeatured').checked=!!p?.is_featured;$('#productFiles').value='';$('#productMsg').textContent='';renderImages(p);renderVariants(p?.product_variants||[]);$('#productModal').style.display='grid'}
function renderImages(p){const box=$('#imagePreview');box.innerHTML=(p?.product_images||[]).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)).map(x=>`<figure><img src="${esc(img(x.storage_path))}" alt=""><figcaption>${x.is_primary?'Primary image':'Image'}</figcaption><div class="image-actions">${!x.is_primary?`<button type="button" onclick="makePrimary('${x.id}','${p.id}')">Primary</button>`:''}<button type="button" onclick="deleteImage('${x.id}','${x.storage_path}','${p.id}')">Delete</button></div></figure>`).join('')}
function renderVariants(vs){$('#variantEditor').innerHTML=vs.map(v=>variantRow(v.id,v.name,v.price,v.stock,v.sku)).join('')}
function variantRow(id='',name='',price='',stock=0,sku=''){return `<div class="variant-row" data-id="${esc(id)}"><label>Name<input class="v-name" value="${esc(name)}" placeholder="Size / finish"></label><label>Price<input class="v-price" type="number" min="0" step=".01" value="${price??''}"></label><label>Stock<input class="v-stock" type="number" min="0" value="${stock??0}"></label><label>SKU<input class="v-sku" value="${esc(sku||'')}"></label><button class="btn danger btn-small" type="button" onclick="this.parentElement.remove()">Remove</button></div>`}
$('#addVariant').onclick=()=>$('#variantEditor').insertAdjacentHTML('beforeend',variantRow());$('#closeModal').onclick=()=>$('#productModal').style.display='none';$('#productModal').onclick=e=>{if(e.target.id==='productModal')e.currentTarget.style.display='none'};$('#productFiles').onchange=e=>{[...e.target.files].forEach(f=>{const r=new FileReader();r.onload=x=>{$('#imagePreview').insertAdjacentHTML('beforeend',`<figure><img src="${x.target.result}" alt=""><figcaption>New image</figcaption></figure>`)};r.readAsDataURL(f)})};
async function makePrimary(imageId,productId){let r=await db.from('product_images').update({is_primary:false}).eq('product_id',productId);if(r.error){toast(r.error.message);return}r=await db.from('product_images').update({is_primary:true}).eq('id',imageId);if(r.error){toast(r.error.message);return}await loadData();renderProducts();openProduct(productId);toast('Primary image updated')}
async function deleteImage(imageId,path,productId){if(!confirm('Delete this product image?'))return;let r=await db.storage.from('product-images').remove([path]);if(r.error){toast(r.error.message);return}r=await db.from('product_images').delete().eq('id',imageId);if(r.error){toast(r.error.message);return}await loadData();renderProducts();openProduct(productId);toast('Image deleted')}
$('#productForm').onsubmit=async e=>{e.preventDefault();const btn=$('#saveProduct'),msg=$('#productMsg');btn.disabled=true;msg.textContent='Saving…';try{const id=$('#productId').value||null,name=$('#productName').value.trim(),payload={name,slug:name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+Date.now().toString(36),short_description:$('#productShort').value.trim(),description:$('#productDescription').value.trim(),price:Number($('#productPrice').value),compare_at_price:$('#productCompare').value?Number($('#productCompare').value):null,stock:Number($('#productStock').value),sku:$('#productSku').value.trim()||null,category_id:$('#productCategory').value||null,is_active:$('#productActive').checked,is_featured:$('#productFeatured').checked,updated_at:new Date().toISOString()};let saved;if(id){const r=await db.from('products').update(payload).eq('id',id).select('id').single();if(r.error)throw r.error;saved=r.data}else{delete payload.updated_at;const r=await db.from('products').insert(payload).select('id').single();if(r.error)throw r.error;saved=r.data}const existing=products.find(p=>p.id===saved.id),base=(existing?.product_images||[]).length?Math.max(...existing.product_images.map(x=>Number(x.sort_order)||0))+1:0;const files=[...$('#productFiles').files];for(let i=0;i<files.length;i++){const f=files[i],safe=f.name.toLowerCase().replace(/[^a-z0-9._-]+/g,'-'),path=`${saved.id}/${Date.now()}-${i}-${safe}`,up=await db.storage.from('product-images').upload(path,f,{upsert:false,contentType:f.type});if(up.error)throw up.error;const r=await db.from('product_images').insert({product_id:saved.id,storage_path:path,alt_text:name,sort_order:base+i,is_primary:!existing?.product_images?.length&&i===0});if(r.error)throw r.error}const keptIds=[];for(const row of $$('#variantEditor .variant-row')){const vid=row.dataset.id||null,vp={product_id:saved.id,name:row.querySelector('.v-name').value.trim(),price:row.querySelector('.v-price').value?Number(row.querySelector('.v-price').value):null,stock:Number(row.querySelector('.v-stock').value||0),sku:row.querySelector('.v-sku').value.trim()||null,is_active:true,updated_at:new Date().toISOString()};if(!vp.name)continue;if(vid){const r=await db.from('product_variants').update(vp).eq('id',vid);if(r.error)throw r.error;keptIds.push(vid)}else{delete vp.updated_at;const r=await db.from('product_variants').insert(vp).select('id').single();if(r.error)throw r.error;keptIds.push(r.data.id)}}if(id){const old=(existing?.product_variants||[]).map(v=>v.id).filter(v=>!keptIds.includes(v));if(old.length){const r=await db.from('product_variants').delete().in('id',old);if(r.error)throw r.error}}await loadData();renderProducts();renderOverview();$('#productModal').style.display='none';toast(id?'Product updated':'Product created')}catch(err){console.error(err);msg.textContent=err.message||'Could not save product'}finally{btn.disabled=false}};
function openCategory(id=''){const c=id?categories.find(x=>x.id===id):null;$('#categoryId').value=c?.id||'';$('#categoryName').value=c?.name||'';$('#categoryDescription').value=c?.description||'';$('#categorySort').value=c?.sort_order??0;$('#categoryActive').checked=c?c.is_active:true;$('#categoryMsg').textContent='';$('#categoryModal').style.display='grid'}$('#closeCategory').onclick=()=>$('#categoryModal').style.display='none';$('#categoryModal').onclick=e=>{if(e.target.id==='categoryModal')e.currentTarget.style.display='none'};$('#categoryForm').onsubmit=async e=>{e.preventDefault();const id=$('#categoryId').value||null,p={name:$('#categoryName').value.trim(),description:$('#categoryDescription').value.trim(),sort_order:Number($('#categorySort').value||0),is_active:$('#categoryActive').checked};const r=id?await db.from('categories').update(p).eq('id',id):await db.from('categories').insert(p);if(r.error){$('#categoryMsg').textContent=r.error.message;return}await loadData();renderCategories();renderProducts();$('#categoryModal').style.display='none';toast(id?'Collection updated':'Collection created')};
boot();
</script></body></html>
