<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#030911">
<title>Admin | SkyShotConner Canvas</title><link rel="stylesheet" href="styles.css">
<style>
/* FUTURISTIC ADMIN COLOUR OVERRIDES */
.admin-top{background:radial-gradient(circle at 85% 20%,rgba(99,215,255,.15),transparent 30%),linear-gradient(135deg,rgba(5,17,29,.96),rgba(19,17,40,.96));border:1px solid rgba(99,215,255,.2);box-shadow:0 25px 70px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.05)}
.admin-top h1{background:linear-gradient(100deg,#fff,#bdefff,#9a7cff);-webkit-background-clip:text;background-clip:text;color:transparent}.admin-top p{color:#91aebb}
.admin-tab{background:rgba(10,25,39,.7);color:#9db5c2;border-color:rgba(99,215,255,.15);backdrop-filter:blur(14px)}.admin-tab:hover{border-color:rgba(99,215,255,.35);color:#eafaff}.admin-tab.active{background:linear-gradient(135deg,rgba(99,215,255,.18),rgba(154,124,255,.16));color:#eafaff;border-color:rgba(99,215,255,.4);box-shadow:0 0 22px rgba(99,215,255,.07)}
.admin-stat,.admin-panel,.admin-order,.admin-empty{background:linear-gradient(145deg,rgba(12,30,47,.82),rgba(4,12,21,.76));border-color:rgba(99,215,255,.14);box-shadow:0 20px 55px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.035)}.admin-stat strong,.admin-panel h2,.admin-panel h3,.admin-order h3{color:#eaf8fc}.admin-stat span,.admin-meta,.admin-order-meta{color:#819daa}
.admin-form label{color:#cfe4ed}.admin-form input,.admin-form textarea,.admin-form select{background:rgba(255,255,255,.045);color:#eaf7fc;border-color:rgba(99,215,255,.14);outline:none}.admin-form input:focus,.admin-form textarea:focus,.admin-form select:focus{border-color:rgba(99,215,255,.5);box-shadow:0 0 0 3px rgba(99,215,255,.06)}.admin-check input{accent-color:#63d7ff}.admin-note{background:rgba(99,215,255,.055);border:1px solid rgba(99,215,255,.1);color:#8fb4c2}
.product-admin-card{background:rgba(255,255,255,.025);border-color:rgba(99,215,255,.12)}.product-admin-card:hover{border-color:rgba(99,215,255,.3);background:rgba(99,215,255,.035)}.product-admin-card h3{color:#eaf8fc}.product-admin-card img,.product-admin-placeholder{background:#071725;border-color:rgba(99,215,255,.1);color:#63d7ff}.danger{background:linear-gradient(135deg,#9e4654,#71333f)!important;border-color:rgba(255,120,140,.25)!important}
.admin-status{background:rgba(99,215,255,.07);border-color:rgba(99,215,255,.18);color:#a9eaff}.admin-order-items{border-color:rgba(99,215,255,.1)}.admin-order-items div{color:#c6dce6}
.admin-modal{background:linear-gradient(145deg,#0b1d2d,#050d16);color:#eaf7fc;border:1px solid rgba(99,215,255,.2);box-shadow:0 30px 100px rgba(0,0,0,.55),0 0 45px rgba(99,215,255,.06)}.modal-backdrop{background:rgba(1,6,12,.78);backdrop-filter:blur(10px)}.admin-modal-head h2{color:#f2fbff}.icon-close{background:rgba(255,255,255,.05);border:1px solid rgba(99,215,255,.15);color:#dff6ff}.image-preview img{border-color:rgba(99,215,255,.12)}.image-preview figcaption{color:#7893a1}.toast{background:linear-gradient(135deg,#0c293c,#211d45);border:1px solid rgba(99,215,255,.2);box-shadow:0 12px 35px rgba(0,0,0,.35)}
</style></head>
<body>
<header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">✈</span><span>SkyShotConner <b>Canvas</b></span></a><button class="menu-toggle" type="button">☰</button><nav class="main-nav"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="account.html">Account</a><a class="cart-link" href="cart.html">Cart <span id="cartCount">0</span></a></nav></header>
<main class="page admin-page"><div class="container admin-shell" id="adminApp"><div class="loading-state"><div class="loader-plane">✈</div><p>Loading admin dashboard…</p></div></div></main><footer><strong>SkyShotConner Canvas</strong><small>© <span id="year"></span></small></footer><div class="toast"></div>
<div class="modal-backdrop" id="productModal"><div class="admin-modal"><div class="admin-modal-head"><h2 id="modalTitle">Add product</h2><button class="icon-close" id="closeModal" type="button">×</button></div><form class="admin-form" id="productForm"><input type="hidden" id="productId"><label>Product name<input required id="productName" placeholder="e.g. Harvard Formation"></label><label>Short description<input id="productShort"></label><label>Full description<textarea id="productDescription" rows="5"></textarea></label><div class="form-grid-2"><label>Price (R)<input required min="0" step="0.01" type="number" id="productPrice"></label><label>Compare price (R)<input min="0" step="0.01" type="number" id="productCompare"></label></div><div class="form-grid-2"><label>Stock<input required min="0" type="number" id="productStock" value="0"></label><label>SKU<input id="productSku" placeholder="SSC-001"></label></div><label>Collection<select id="productCategory"></select></label><div class="admin-checks"><label class="admin-check"><input type="checkbox" id="productActive" checked> Visible in shop</label><label class="admin-check"><input type="checkbox" id="productFeatured"> Featured product</label></div><label>New product images<input type="file" id="productFiles" accept="image/jpeg,image/png,image/webp" multiple><small class="admin-meta">Existing images stay attached when editing. New uploads are added.</small></label><div class="image-preview" id="imagePreview"></div><div class="admin-note">Edit any existing product here, including products created by other admins. Changes are saved directly to Supabase.</div><button class="btn btn-primary btn-wide" id="saveProduct" type="submit">Save product</button><p class="form-msg" id="productMsg"></p></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient('https://xdkoutuetajwzwrjzehw.supabase.co','sb_publishable_K0r7cxL94PMJ5S0HM8aKfQ_cc73t2hu',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>`R ${Number(v||0).toLocaleString('en-ZA',{minimumFractionDigits:2})}`,img=p=>p?db.storage.from('product-images').getPublicUrl(p).data.publicUrl:'';let categories=[],products=[],orders=[];
function toast(t){const x=$('.toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}function setupNav(){const b=$('.menu-toggle'),n=$('.main-nav');b.onclick=()=>n.classList.toggle('open');$('#year').textContent=new Date().getFullYear();const c=JSON.parse(localStorage.getItem('ssc_canvas_cart')||'[]');$('#cartCount').textContent=c.reduce((n,i)=>n+Number(i.qty||1),0)}
async function boot(){setupNav();const app=$('#adminApp');const {data:{user}}=await db.auth.getUser();if(!user){app.innerHTML='<div class="admin-empty"><h2>Admin sign-in required</h2><p>Please sign in with your administrator account.</p><a class="btn btn-primary" href="account.html">Go to account</a></div>';return}const {data:isAdmin,error}=await db.rpc('is_admin');if(error||!isAdmin){app.innerHTML='<div class="admin-empty"><h2>Access denied</h2><p>This account is not an administrator.</p><a class="btn btn-outline" href="index.html">Back to site</a></div>';return}await loadData();renderShell(user)}
async function loadData(){const [cr,pr,or]=await Promise.all([db.from('categories').select('*').order('sort_order'),db.from('products').select('*,categories(name),product_images(storage_path,is_primary,sort_order)').order('created_at',{ascending:false}),db.from('orders').select('*').order('created_at',{ascending:false})]);if(cr.error)throw cr.error;if(pr.error)throw pr.error;if(or.error)throw or.error;categories=cr.data||[];products=pr.data||[];orders=or.data||[]}
function renderShell(user){$('#adminApp').innerHTML=`<div class="admin-top"><div><span class="eyebrow" style="color:#91d2e7">CONTROL CENTRE</span><h1>Admin Dashboard</h1><p>${esc(user.email)} · Store management</p></div><div class="admin-actions"><a class="btn btn-outline" style="color:#fff;border-color:rgba(255,255,255,.3)" href="index.html">View store</a><button class="btn btn-outline" style="color:#fff;border-color:rgba(255,255,255,.3)" id="logout">Sign out</button></div></div><div class="admin-tabs"><button class="admin-tab active" data-tab="overview">Overview</button><button class="admin-tab" data-tab="products">Products</button><button class="admin-tab" data-tab="orders">Orders</button></div><section class="admin-section active" id="tab-overview"></section><section class="admin-section" id="tab-products"></section><section class="admin-section" id="tab-orders"></section>`;$$('.admin-tab').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));$('#logout').onclick=async()=>{await db.auth.signOut();location.href='account.html'};renderOverview();renderProducts();renderOrders()}
function showTab(t){$$('.admin-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));$$('.admin-section').forEach(s=>s.classList.toggle('active',s.id==='tab-'+t))}
function renderOverview(){const active=products.filter(p=>p.is_active).length,low=products.filter(p=>p.is_active&&Number(p.stock)<=3).length,pending=orders.filter(o=>!['completed','cancelled'].includes(o.status)).length,revenue=orders.filter(o=>o.payment_status==='paid').reduce((s,o)=>s+Number(o.total||0),0);$('#tab-overview').innerHTML=`<div class="admin-stats"><div class="admin-stat"><strong>${active}</strong><span>Active products</span></div><div class="admin-stat"><strong>${low}</strong><span>Low stock</span></div><div class="admin-stat"><strong>${pending}</strong><span>Open orders</span></div><div class="admin-stat"><strong>${money(revenue)}</strong><span>Paid revenue</span></div></div><div class="admin-panel" style="margin-top:20px"><span class="eyebrow">QUICK ACTIONS</span><h2>Store management</h2><div class="actions"><button class="btn btn-primary" onclick="openProduct()">＋ Add product</button><button class="btn btn-outline" onclick="showTab('products')">Manage products</button><button class="btn btn-outline" onclick="showTab('orders')">View orders</button></div></div>`}
function productImage(p){const x=(p.product_images||[]).find(i=>i.is_primary)||(p.product_images||[])[0];return img(x?.storage_path)}
function renderProducts(){const active=products.filter(p=>p.is_active),hidden=products.filter(p=>!p.is_active);$('#tab-products').innerHTML=`<div class="section-head"><div><span class="eyebrow">CATALOGUE</span><h2>Products</h2><p>Edit existing products or create new ones.</p></div><button class="btn btn-primary" onclick="openProduct()">＋ Add product</button></div><div class="admin-products">${active.length?active.map(productCard).join(''):'<div class="admin-empty">No active products.</div>'}</div>${hidden.length?`<div class="admin-panel" style="margin-top:20px"><h3>Hidden products</h3><div class="admin-products">${hidden.map(productCard).join('')}</div></div>`:''}`}
function productCard(p){const url=productImage(p);return `<article class="product-admin-card"><div>${url?`<img src="${esc(url)}" alt="">`:'<div class="product-admin-placeholder">✈</div>'}</div><div><h3>${esc(p.name)}</h3><div class="admin-meta">${money(p.price)} · Stock ${Number(p.stock||0)} · ${esc(p.categories?.name||'Uncategorised')}</div><div class="admin-meta">${esc(p.sku||'No SKU')} ${p.is_featured?'· Featured':''} ${!p.is_active?'· Hidden':''}</div></div><div class="product-admin-actions"><button class="btn btn-outline btn-small" onclick="openProduct('${p.id}')">Edit</button>${p.is_active?`<button class="btn danger btn-small" onclick="toggleProduct('${p.id}',false)">Hide</button>`:`<button class="btn btn-primary btn-small" onclick="toggleProduct('${p.id}',true)">Restore</button>`}</div></article>`}
function renderOrders(){const el=$('#tab-orders');el.innerHTML=`<div class="section-head"><div><span class="eyebrow">ORDERS</span><h2>Customer orders</h2></div></div><div class="admin-orders">${orders.length?orders.map(o=>`<article class="admin-order"><div class="admin-order-head"><div><h3>#${o.id.slice(0,8).toUpperCase()}</h3><div class="admin-order-meta">${esc(o.customer_name||'Customer')} · ${esc(o.customer_email||'')}<br>${new Date(o.created_at).toLocaleString('en-ZA')}</div></div><select class="admin-status-select" onchange="updateOrder('${o.id}',this.value)">${['pending','processing','shipped','completed','cancelled'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="admin-order-grid"><div><strong>Delivery</strong><p class="admin-order-meta">${esc(JSON.stringify(o.shipping_address||{}).replace(/[{}\"]/g,'').replace(/,/g,' · '))}</p></div><div><strong>Total</strong><p>${money(o.total)} · ${esc(o.payment_status||'pending')}</p></div></div></article>`).join(''):'<div class="admin-empty">No orders yet.</div>'}</div>`}
async function toggleProduct(id,active){const {error}=await db.from('products').update({is_active:active,updated_at:new Date().toISOString()}).eq('id',id);if(error){toast(error.message);return}await loadData();renderProducts();renderOverview();toast(active?'Product restored':'Product hidden')}
async function updateOrder(id,status){const {error}=await db.from('orders').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error){toast(error.message);return}const o=orders.find(x=>x.id===id);if(o)o.status=status;renderOrders();renderOverview();toast('Order updated')}
function fillCategories(){const s=$('#productCategory');s.innerHTML='<option value="">Uncategorised</option>'+categories.filter(c=>c.is_active!==false).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}
function openProduct(id=''){fillCategories();const p=id?products.find(x=>x.id===id):null;$('#modalTitle').textContent=p?'Edit product':'Add product';$('#productId').value=p?.id||'';$('#productName').value=p?.name||'';$('#productShort').value=p?.short_description||'';$('#productDescription').value=p?.description||'';$('#productPrice').value=p?.price??'';$('#productCompare').value=p?.compare_at_price??'';$('#productStock').value=p?.stock??0;$('#productSku').value=p?.sku||'';$('#productCategory').value=p?.category_id||'';$('#productActive').checked=p?p.is_active:true;$('#productFeatured').checked=!!p?.is_featured;$('#productFiles').value='';renderPreview(p);$('#productMsg').textContent='';$('#productModal').classList.add('open')}
function renderPreview(p){const box=$('#imagePreview'),im=p?.product_images||[];box.innerHTML=im.length?im.sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)).map(x=>`<figure><img src="${esc(img(x.storage_path))}" alt=""><figcaption>${x.is_primary?'Primary image':'Image'}</figcaption></figure>`).join(''):''}
$('#closeModal').onclick=()=>$('#productModal').classList.remove('open');$('#productModal').onclick=e=>{if(e.target.id==='productModal')e.currentTarget.classList.remove('open')};$('#productFiles').onchange=e=>{const box=$('#imagePreview');[...e.target.files].forEach(f=>{const r=new FileReader();r.onload=ev=>{const fig=document.createElement('figure');fig.innerHTML=`<img src="${ev.target.result}" alt=""><figcaption>New image</figcaption>`;box.appendChild(fig)};r.readAsDataURL(f)})};
$('#productForm').onsubmit=async e=>{e.preventDefault();const msg=$('#productMsg'),btn=$('#saveProduct');btn.disabled=true;msg.textContent='Saving…';try{const id=$('#productId').value||null,name=$('#productName').value.trim(),payload={name,slug:name.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+Date.now().toString(36),short_description:$('#productShort').value.trim(),description:$('#productDescription').value.trim(),price:Number($('#productPrice').value),compare_at_price:$('#productCompare').value?Number($('#productCompare').value):null,stock:Number($('#productStock').value),sku:$('#productSku').value.trim()||null,category_id:$('#productCategory').value||null,is_active:$('#productActive').checked,is_featured:$('#productFeatured').checked,updated_at:new Date().toISOString()};let saved;if(id){const {data,error}=await db.from('products').update(payload).eq('id',id).select('id').single();if(error)throw error;saved=data}else{delete payload.updated_at;const {data,error}=await db.from('products').insert(payload).select('id').single();if(error)throw error;saved=data}const files=[...$('#productFiles').files];for(let i=0;i<files.length;i++){const file=files[i],safe=file.name.toLowerCase().replace(/[^a-z0-9._-]+/g,'-'),path=`${saved.id}/${Date.now()}-${i}-${safe}`;const up=await db.storage.from('product-images').upload(path,file,{upsert:false,contentType:file.type});if(up.error)throw up.error;const ins=await db.from('product_images').insert({product_id:saved.id,storage_path:path,alt_text:name,sort_order:i,is_primary:i===0});if(ins.error)throw ins.error}await loadData();renderProducts();renderOverview();$('#productModal').classList.remove('open');toast(id?'Product updated':'Product created')}catch(err){console.error(err);msg.textContent=err.message||'Could not save product'}finally{btn.disabled=false}};
boot().catch(err=>{$('#adminApp').innerHTML=`<div class="admin-empty"><h2>Admin dashboard could not load</h2><p>${esc(err.message||'Please refresh and try again.')}</p></div>`})
</script></body></html>
