<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071521">
<title>Admin | SkyShotConner Canvas</title>
<link rel="stylesheet" href="styles.css">
<style>
.admin-page{padding:34px 0 70px}.admin-shell{display:grid;gap:22px}.admin-top{background:linear-gradient(135deg,#071521,#10344a);color:#fff;border-radius:26px;padding:28px;display:flex;align-items:center;justify-content:space-between;gap:20px}.admin-top h1{margin:0;font-size:clamp(2rem,5vw,3.5rem);letter-spacing:-.05em}.admin-top p{margin:7px 0 0;color:#c7d6de}.admin-actions{display:flex;gap:9px;flex-wrap:wrap}.admin-tabs{display:flex;gap:8px;overflow-x:auto;padding:4px}.admin-tab{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 16px;font-weight:800;white-space:nowrap}.admin-tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}.admin-section{display:none}.admin-section.active{display:block}.admin-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.admin-stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}.admin-stat strong{display:block;font-size:1.9rem;letter-spacing:-.04em}.admin-stat span{color:var(--muted);font-size:.84rem}.admin-grid-new{display:grid;grid-template-columns:minmax(0,390px) minmax(0,1fr);gap:20px}.admin-form{display:grid;gap:12px}.admin-form label{font-weight:800;font-size:.9rem}.admin-form input,.admin-form textarea,.admin-form select{margin-top:6px}.admin-checks{display:grid;gap:10px}.admin-check{display:flex!important;align-items:center;gap:9px;font-weight:700!important}.admin-check input{width:auto!important;margin:0!important}.product-admin-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:14px;align-items:center}.product-admin-card img,.product-admin-placeholder{width:78px;height:65px;border-radius:12px;object-fit:cover;background:#e4edf1;display:grid;place-items:center;color:#486675;font-size:1.7rem}.product-admin-card h3{margin:0 0 3px;font-size:1rem}.product-admin-meta{color:var(--muted);font-size:.82rem}.product-admin-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.btn-small{padding:9px 11px;font-size:.8rem}.admin-orders{display:grid;gap:12px}.admin-order{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px}.admin-order-head{display:flex;justify-content:space-between;gap:15px;align-items:start}.admin-order h3{margin:0}.admin-order-meta{color:var(--muted);font-size:.84rem}.admin-order-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:15px}.admin-order-items{border-top:1px solid var(--line);margin-top:15px;padding-top:12px}.admin-order-items div{display:flex;justify-content:space-between;gap:12px;padding:5px 0}.admin-status{padding:7px 10px;border-radius:99px;border:1px solid var(--line);background:#f5f8fa;font-weight:800;font-size:.75rem;white-space:nowrap}.admin-status-select{width:auto!important;min-width:130px;margin:0!important}.admin-empty{background:#fff;border:1px dashed #c8d3db;border-radius:18px;padding:35px;text-align:center;color:var(--muted)}.admin-note{background:#eef5f7;border-radius:14px;padding:12px 14px;color:#345463;font-size:.85rem}.modal-backdrop{position:fixed;inset:0;background:rgba(2,13,21,.65);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}.modal-backdrop.open{display:flex}.admin-modal{background:var(--paper);width:min(680px,100%);max-height:92vh;overflow:auto;border-radius:24px;padding:22px;box-shadow:0 30px 100px rgba(0,0,0,.3)}.admin-modal-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px}.admin-modal-head h2{margin:0}.icon-close{border:0;background:#e8eef2;width:38px;height:38px;border-radius:50%;font-size:1.2rem}.image-preview{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px}.image-preview img{width:100%;aspect-ratio:1;border-radius:10px;object-fit:cover}.danger{background:#8f3e43!important;color:#fff!important;border-color:#8f3e43!important}
@media(max-width:900px){.admin-stats{grid-template-columns:repeat(2,1fr)}.admin-grid-new{grid-template-columns:1fr}.admin-order-grid{grid-template-columns:1fr}}
@media(max-width:650px){.admin-page{padding:20px 0 45px}.admin-top{padding:20px;border-radius:20px;align-items:flex-start;flex-direction:column}.admin-top .btn{width:100%}.admin-tabs{margin:0 -2px}.admin-stats{grid-template-columns:1fr 1fr;gap:9px}.admin-stat{padding:14px}.admin-stat strong{font-size:1.45rem}.product-admin-card{grid-template-columns:62px minmax(0,1fr)}.product-admin-card img,.product-admin-placeholder{width:62px;height:58px}.product-admin-actions{grid-column:1/-1;justify-content:stretch}.product-admin-actions .btn{flex:1}.admin-order-head{flex-direction:column}.admin-order-head .admin-status{align-self:flex-start}.image-preview{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header class="site-header">
<a class="brand" href="index.html"><span class="brand-mark">✈</span><span>SkyShotConner <b>Canvas</b></span></a>
<button class="menu-toggle" type="button" aria-label="Open menu">☰</button>
<nav class="main-nav"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="account.html">Account</a><a class="cart-link" href="cart.html">Cart <span id="cartCount">0</span></a></nav>
</header>
<main class="page admin-page"><div class="container admin-shell" id="adminApp"><div class="loading-state"><div class="loader-plane">✈</div><p>Loading admin dashboard…</p></div></div></main>
<footer><strong>SkyShotConner Canvas</strong><small>© <span id="year"></span></small></footer>
<div class="toast"></div>
<div class="modal-backdrop" id="productModal"><div class="admin-modal"><div class="admin-modal-head"><h2 id="modalTitle">Add product</h2><button class="icon-close" type="button" id="closeModal">×</button></div><form class="admin-form" id="productForm">
<input type="hidden" name="id" id="productId">
<label>Product name<input required name="name" id="productName" placeholder="e.g. Harvard Formation"></label>
<label>Short description<input name="short_description" id="productShort" placeholder="One-line product description"></label>
<label>Full description<textarea name="description" id="productDescription" rows="5" placeholder="Describe the photograph and canvas."></textarea></label>
<div class="form-grid-2"><label>Price (R)<input required min="0" step="0.01" type="number" name="price" id="productPrice"></label><label>Compare price (R)<input min="0" step="0.01" type="number" name="compare_at_price" id="productCompare"></label></div>
<div class="form-grid-2"><label>Stock<input required min="0" type="number" name="stock" id="productStock" value="0"></label><label>SKU<input name="sku" id="productSku" placeholder="SSC-001"></label></div>
<label>Collection<select name="category_id" id="productCategory"></select></label>
<div class="admin-checks"><label class="admin-check"><input type="checkbox" name="is_active" id="productActive" checked> Visible in shop</label><label class="admin-check"><input type="checkbox" name="is_featured" id="productFeatured"> Featured product</label></div>
<label>Product images<input type="file" id="productFiles" accept="image/jpeg,image/png,image/webp" multiple><small class="product-admin-meta">Images are uploaded to the Supabase product-images bucket.</small></label><div class="image-preview" id="imagePreview"></div>
<div class="admin-note">You can create products now and add your real aviation photographs whenever you're ready. No payment gateway is changed by this dashboard.</div>
<button class="btn btn-primary btn-wide" type="submit" id="saveProduct">Save product</button><p class="form-msg" id="productMsg"></p>
</form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://xdkoutuetajwzwrjzehw.supabase.co';
const SUPABASE_KEY='sb_publishable_K0r7cxL94PMJ5S0HM8aKfQ_cc73t2hu';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>`R ${Number(v||0).toLocaleString('en-ZA',{minimumFractionDigits:2})}`;
const img=p=>p?db.storage.from('product-images').getPublicUrl(p).data.publicUrl:'';
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
function toast(t){const x=$('.toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function setupNav(){const b=$('.menu-toggle'),n=$('.main-nav');if(b&&n)b.onclick=()=>n.classList.toggle('open');const y=$('#year');if(y)y.textContent=new Date().getFullYear();const c=JSON.parse(localStorage.getItem('ssc_canvas_cart')||'[]');$('#cartCount').textContent=c.reduce((n,i)=>n+Number(i.qty||1),0)}
let categories=[],products=[],orders=[];
async function boot(){setupNav();const app=$('#adminApp');const {data:{user}}=await db.auth.getUser();if(!user){app.innerHTML='<div class="admin-empty"><h2>Admin sign-in required</h2><p>Please sign in with your administrator account.</p><a class="btn btn-primary" href="account.html">Go to account</a></div>';return}const {data:isAdmin,error}=await db.rpc('is_admin');if(error||!isAdmin){app.innerHTML='<div class="admin-empty"><h2>Access denied</h2><p>This account is not an administrator.</p><a class="btn btn-outline" href="index.html">Back to site</a></div>';return}await loadData();renderShell(user);showTab('overview')}
async function loadData(){const [cr,pr,or]=await Promise.all([db.from('categories').select('*').order('sort_order'),db.from('products').select('*,categories(name),product_images(storage_path,is_primary,sort_order)').order('created_at',{ascending:false}),db.from('orders').select('*').order('created_at',{ascending:false})]);if(cr.error)throw cr.error;if(pr.error)throw pr.error;if(or.error)throw or.error;categories=cr.data||[];products=pr.data||[];orders=or.data||[]}
function renderShell(user){$('#adminApp').innerHTML=`<div class="admin-top"><div><span class="eyebrow" style="color:#91d2e7">CONTROL CENTRE</span><h1>Admin Dashboard</h1><p>${esc(user.email)} · Manage your SkyShotConner Canvas store</p></div><div class="admin-actions"><a class="btn btn-outline" style="color:#fff;border-color:rgba(255,255,255,.3)" href="index.html">View store</a><button class="btn btn-outline" style="color:#fff;border-color:rgba(255,255,255,.3)" id="logout">Sign out</button></div></div><div class="admin-tabs"><button class="admin-tab active" data-tab="overview">Overview</button><button class="admin-tab" data-tab="products">Products</button><button class="admin-tab" data-tab="orders">Orders</button></div><section class="admin-section active" id="tab-overview"></section><section class="admin-section" id="tab-products"></section><section class="admin-section" id="tab-orders"></section>`;$$('.admin-tab').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));$('#logout').onclick=async()=>{await db.auth.signOut();location.href='account.html'};renderOverview();renderProducts();renderOrders()}
function showTab(tab){$$('.admin-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$$('.admin-section').forEach(s=>s.classList.toggle('active',s.id==='tab-'+tab))}
function renderOverview(){const active=products.filter(p=>p.is_active).length;const low=products.filter(p=>p.is_active&&Number(p.stock)<=3).length;const pending=orders.filter(o=>!['completed','cancelled'].includes(o.status)).length;const revenue=orders.filter(o=>o.payment_status==='paid').reduce((s,o)=>s+Number(o.total||0),0);$('#tab-overview').innerHTML=`<div class="admin-stats"><div class="admin-stat"><strong>${active}</strong><span>Active products</span></div><div class="admin-stat"><strong>${low}</strong><span>Low stock</span></div><div class="admin-stat"><strong>${pending}</strong><span>Open orders</span></div><div class="admin-stat"><strong>${money(revenue)}</strong><span>Paid revenue</span></div></div><div class="section" style="padding:25px 0 0"><div class="section-head"><div><span class="eyebrow">QUICK ACTIONS</span><h2>Store management</h2></div></div><div class="actions"><button class="btn btn-primary" onclick="openProduct()">＋ Add product</button><button class="btn btn-outline" onclick="showTab('products')">Manage products</button><button class="btn btn-outline" onclick="showTab('orders')">View orders</button></div></div>`}
function productImage(p){const im=(p.product_images||[]).find(i=>i.is_primary)||(p.product_images||[])[0];return img(im?.storage_path)}
function renderProducts(){const active=products.filter(p=>p.is_active);$('#tab-products').innerHTML=`<div class="section-head"><div><span class="eyebrow">CATALOGUE</span><h2>Products</h2><p>Create, edit, feature and hide your canvas products.</p></div><button class="btn btn-primary" onclick="openProduct()">＋ Add product</button></div><div class="admin-products">${active.length?active.map(p=>`<article class="product-admin-card"><div>${productImage(p)?`<img src="${esc(productImage(p))}" alt="">`:'<div class="product-admin-placeholder">✈</div>'}</div><div><h3>${esc(p.name)}</h3><div class="product-admin-meta">${money(p.price)} · Stock ${Number(p.stock||0)} · ${esc(p.categories?.name||'Uncategorised')}</div><div class="product-admin-meta">${esc(p.sku||'No SKU')} ${p.is_featured?'· Featured':''}</div></div><div class="product-admin-actions"><button class="btn btn-outline btn-small" onclick="openProduct('${p.id}')">Edit</button><button class="btn danger btn-small" onclick="deactivateProduct('${p.id}')">Hide</button></div></article>`).join(''):'<div class="admin-empty"><h3>No active products</h3><p>Add your first aviation canvas when you're ready.</p><button class="btn btn-primary" onclick="openProduct()">Add product</button></div>'}</div>`}
function renderOrders(){const el=$('#tab-orders');el.innerHTML=`<div class="section-head"><div><span class="eyebrow">CUSTOMER ORDERS</span><h2>Orders</h2><p>Review orders and update their status.</p></div></div><div class="admin-orders">${orders.length?orders.map(o=>`<article class="admin-order"><div class="admin-order-head"><div><h3>#${o.id.slice(0,8).toUpperCase()}</h3><div class="admin-order-meta">${esc(o.customer_name||'Customer')} · ${esc(o.customer_email||'')} · ${new Date(o.created_at).toLocaleString('en-ZA')}</div></div><span class="admin-status">${esc(o.payment_status||'pending')} · ${esc(o.status||'pending')}</span></div><div class="admin-order-grid"><div><strong>Delivery</strong><div class="admin-order-meta">${esc(o.shipping_address?.address||'')}<br>${esc(o.shipping_address?.city||'')}, ${esc(o.shipping_address?.province||'')} ${esc(o.shipping_address?.postal_code||'')}</div></div><div><strong>Total</strong><div>${money(o.total)}<br><select class="admin-status-select" onchange="updateOrder('${o.id}',this.value)"><option value="pending" ${o.status==='pending'?'selected':''}>Pending</option><option value="processing" ${o.status==='processing'?'selected':''}>Processing</option><option value="shipped" ${o.status==='shipped'?'selected':''}>Shipped</option><option value="completed" ${o.status==='completed'?'selected':''}>Completed</option><option value="cancelled" ${o.status==='cancelled'?'selected':''}>Cancelled</option></select></div></div></div><div class="admin-order-items"><strong>Items</strong>${o.items?.length?o.items.map(i=>`<div><span>${esc(i.product_name)} × ${i.quantity}</span><strong>${money(i.line_total)}</strong></div>`).join(''):'<div class="admin-order-meta">Order items are stored securely in Supabase.</div>'}</div></article>`).join(''):'<div class="admin-empty"><h3>No orders yet</h3><p>Customer orders will appear here.</p></div>'}</div>`;loadOrderItems()}
async function loadOrderItems(){if(!orders.length)return;const ids=orders.map(o=>o.id);const {data}=await db.from('order_items').select('*').in('order_id',ids);(data||[]).forEach(i=>{const o=orders.find(x=>x.id===i.order_id);if(o)(o.items||(o.items=[])).push(i)});renderOrdersNoLoop()}
function renderOrdersNoLoop(){const cards=$$('.admin-order');orders.forEach((o,idx)=>{const holder=cards[idx]?.querySelector('.admin-order-items');if(!holder)return;holder.innerHTML=`<strong>Items</strong>${o.items?.length?o.items.map(i=>`<div><span>${esc(i.product_name)} × ${i.quantity}</span><strong>${money(i.line_total)}</strong></div>`).join(''):'<div class="admin-order-meta">No items found.</div>'}`})}
async function updateOrder(id,status){const {error}=await db.from('orders').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error){toast(error.message);return}const o=orders.find(x=>x.id===id);if(o)o.status=status;toast('Order updated')}
function fillCategories(){const s=$('#productCategory');s.innerHTML='<option value="">Select collection</option>'+categories.filter(c=>c.is_active).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}
async function openProduct(id=''){const modal=$('#productModal');modal.classList.add('open');$('#productForm').reset();$('#productId').value=id;$('#imagePreview').innerHTML='';fillCategories();$('#modalTitle').textContent=id?'Edit product':'Add product';if(!id){$('#productActive').checked=true;$('#productFeatured').checked=false;$('#productStock').value=0;return}const p=products.find(x=>x.id===id);if(!p)return;$('#productName').value=p.name||'';$('#productShort').value=p.short_description||'';$('#productDescription').value=p.description||'';$('#productPrice').value=p.price??'';$('#productCompare').value=p.compare_at_price??'';$('#productStock').value=p.stock??0;$('#productSku').value=p.sku||'';$('#productCategory').value=p.category_id||'';$('#productActive').checked=!!p.is_active;$('#productFeatured').checked=!!p.is_featured;(p.product_images||[]).forEach(i=>{const u=img(i.storage_path);if(u)$('#imagePreview').insertAdjacentHTML('beforeend',`<img src="${esc(u)}" alt="">`)})}
$('#closeModal').onclick=()=>$('#productModal').classList.remove('open');$('#productModal').onclick=e=>{if(e.target.id==='productModal')$('#productModal').classList.remove('open')};
$('#productFiles').onchange=e=>{$('#imagePreview').innerHTML=[...e.target.files].map(f=>`<img src="${URL.createObjectURL(f)}" alt="">`).join('')};
$('#productForm').onsubmit=async e=>{e.preventDefault();const btn=$('#saveProduct'),msg=$('#productMsg');btn.disabled=true;msg.textContent='Saving product…';try{const f=new FormData(e.currentTarget);const id=f.get('id');const name=String(f.get('name')).trim();const base={name,slug:name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||crypto.randomUUID(),short_description:f.get('short_description'),description:f.get('description'),price:Number(f.get('price')||0),compare_at_price:f.get('compare_at_price')?Number(f.get('compare_at_price')):null,stock:Number(f.get('stock')||0),sku:f.get('sku')||null,category_id:f.get('category_id')||null,is_active:$('#productActive').checked,is_featured:$('#productFeatured').checked,updated_at:new Date().toISOString()};let product;if(id){const r=await db.from('products').update(base).eq('id',id).select().single();if(r.error)throw r.error;product=r.data}else{const r=await db.from('products').insert(base).select().single();if(r.error)throw r.error;product=r.data}const files=[...$('#productFiles').files];for(let n=0;n<files.length;n++){const file=files[n];const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=`${product.id}/${Date.now()}-${n}.${ext}`;const up=await db.storage.from('product-images').upload(path,file,{upsert:false,contentType:file.type});if(up.error)throw up.error;const ir=await db.from('product_images').insert({product_id:product.id,storage_path:path,alt_text:product.name,sort_order:n,is_primary:n===0});if(ir.error)throw ir.error}msg.textContent='Saved.';$('#productModal').classList.remove('open');await loadData();renderProducts();renderOverview();toast(id?'Product updated':'Product created')}catch(err){console.error(err);msg.textContent=err.message||'Could not save product'}finally{btn.disabled=false}};
async function deactivateProduct(id){if(!confirm('Hide this product from the shop?'))return;const {error}=await db.from('products').update({is_active:false,updated_at:new Date().toISOString()}).eq('id',id);if(error){toast(error.message);return}await loadData();renderProducts();renderOverview();toast('Product hidden')}
window.openProduct=openProduct;window.deactivateProduct=deactivateProduct;window.updateOrder=updateOrder;
boot().catch(err=>{console.error(err);$('#adminApp').innerHTML=`<div class="admin-empty"><h2>Admin dashboard could not load</h2><p>${esc(err.message||'Please refresh and try again.')}</p></div>`});
</script>
</body>
</html>
