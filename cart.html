<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart — SkyShotConner Canvas</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">✈</span><span>SkyShotConner <b>Canvas</b></span></a><button class="menu-toggle">☰</button><nav class="main-nav"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="account.html">Account</a><a class="cart-link" href="cart.html">Cart <span id="cartCount">0</span></a></nav></header><main class="page"><span class="eyebrow">YOUR ORDER</span><h1>Your cart.</h1><div id="cart"></div></main><footer><strong>SkyShotConner Canvas</strong><small>© <span id="year"></span></small></footer><script src="app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const el=document.querySelector('#cart');const c=getCart();if(!c.length){el.innerHTML='<div class="empty"><h2>Your cart is empty</h2><p>Find an aviation canvas you love and add it here.</p><a class="btn btn-primary" style="background:#0b1f33;color:#fff" href="shop.html">Shop canvases</a></div>';return}el.innerHTML='<div class="cart-list">'+c.map((p,i)=>`<div class="cart-row"><div class="product-image" style="width:90px;height:70px;flex:none">${p.image?'': '✈'}</div><div style="flex:1"><strong>${p.name}</strong><div>Qty ${p.qty||1}</div></div><strong>R ${(Number(p.price)*(p.qty||1)).toLocaleString('en-ZA')}</strong><button onclick="removeItem(${i})">Remove</button></div>`).join('')+'</div><div class="cart-total"><strong>Total</strong><strong>R '+c.reduce((s,p)=>s+Number(p.price)*(p.qty||1),0).toLocaleString('en-ZA')+'</strong></div>'});function removeItem(i){const c=getCart();c.splice(i,1);setCart(c);location.reload()}</script></body></html>
