<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account & Checkout — SkyShotConner Canvas</title>
<link rel="stylesheet" href="styles.css">
<style>
.account-shell{max-width:1100px;margin:0 auto;padding:45px 20px 80px}.account-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.account-card{background:#fff;border:1px solid #dfe5ea;border-radius:18px;padding:26px;box-shadow:0 12px 35px rgba(0,0,0,.07)}.account-card h1,.account-card h2{margin-top:0}.account-card input,.account-card textarea{width:100%;box-sizing:border-box;margin:7px 0;padding:13px 14px;border:1px solid #cfd7df;border-radius:10px;font:inherit}.account-card textarea{min-height:95px;resize:vertical}.account-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.account-msg{min-height:22px}.checkout-layout{display:grid;grid-template-columns:1.15fr .85fr;gap:22px}.checkout-item{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid #e5e9ed}.total-row{display:flex;justify-content:space-between;padding-top:18px;font-size:1.1rem}.order-item{display:flex;justify-content:space-between;gap:15px;padding:15px 0;border-bottom:1px solid #e5e9ed}.account-status{margin-bottom:20px;padding:14px;border-radius:12px;background:#f4f7f9}.success{background:#edf8f1;border:1px solid #b9dec5}.error{background:#fff1f1;border:1px solid #e6bcbc}@media(max-width:750px){.account-grid,.checkout-layout{grid-template-columns:1fr}.account-shell{padding:28px 15px 60px}.account-card{padding:20px}.order-item{flex-direction:column}}
</style>
</head>
<body>
<header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">✈</span><span>SkyShotConner <b>Canvas</b></span></a><button class="menu-toggle" id="menuToggle" type="button">☰</button><nav class="main-nav" id="mainNav"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="account.html">Account</a><a class="cart-link" href="cart.html">Cart <span id="cartCount">0</span></a></nav></header>
<main class="page"><div class="account-shell"><div id="accountBox"></div></div></main>
<footer><strong>SkyShotConner Canvas</strong><small>© <span id="year"></span></small></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';
const URL='https://xdkoutuetajwzwrjzehw.supabase.co',KEY='sb_publishable_K0r7cxL94PMJ5S0HM8aKfQ_cc73t2hu',CART_KEY='ssc_canvas_cart';
const box=document.getElementById('accountBox');
const esc=v=>String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const getCart=()=>{try{const x=JSON.parse(localStorage.getItem(CART_KEY)||'[]');return Array.isArray(x)?x:[]}catch{return[]}};
const cartQty=()=>getCart().reduce((n,x)=>n+Math.max(1,Number(x.qty||1)),0);
const money=v=>'R '+Number(v||0).toLocaleString('en-ZA',{minimumFractionDigits:2});
const updateCount=()=>document.getElementById('cartCount').textContent=cartQty();
document.getElementById('year').textContent=new Date().getFullYear();document.getElementById('menuToggle').onclick=()=>document.getElementById('mainNav').classList.toggle('open');updateCount();
let db;
try{db=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}catch(e){box.innerHTML='<div class="account-card"><h1>Account unavailable</h1><p>Please refresh the page.</p></div>';return}
function authUI(msg){box.innerHTML='<div class="account-status">'+(msg||'Sign in or create an account to manage your orders and checkout.')+'</div><div class="account-grid"><section class="account-card"><span class="eyebrow">WELCOME BACK</span><h1>Sign in</h1><p>Access your account and checkout.</p><form id="loginForm"><input name="email" type="email" required autocomplete="email" placeholder="Email address"><input name="password" type="password" required autocomplete="current-password" placeholder="Password"><div class="account-actions"><button class="btn btn-primary" type="submit">Sign in</button><a class="btn btn-outline" href="cart.html">Back to cart</a></div><p id="loginMsg" class="account-msg"></p></form></section><section class="account-card"><span class="eyebrow">NEW CUSTOMER</span><h1>Create account</h1><p>Create an account to checkout and track orders.</p><form id="signupForm"><input name="name" required autocomplete="name" placeholder="Full name"><input name="email" type="email" required autocomplete="email" placeholder="Email address"><input name="password" type="password" required minlength="6" autocomplete="new-password" placeholder="Password — minimum 6 characters"><div class="account-actions"><button class="btn btn-primary" type="submit">Create account</button></div><p id="signupMsg" class="account-msg"></p></form></section></div>';
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),m=document.getElementById('loginMsg');m.textContent='Signing in…';const r=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(r.error){m.textContent=r.error.message;return}renderAccount(r.data.user)};
document.getElementById('signupForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),m=document.getElementById('signupMsg');m.textContent='Creating account…';const r=await db.auth.signUp({email:f.get('email'),password:f.get('password'),options:{data:{full_name:f.get('name')}}});if(r.error){m.textContent=r.error.message;return}if(r.data.session)renderAccount(r.data.user);else m.textContent='Account created. Please check your email to confirm your account.'};}
function checkoutHTML(){const c=getCart();if(!c.length)return '<section class="account-card"><span class="eyebrow">CHECKOUT</span><h1>Your cart is empty</h1><p>Add a canvas to your cart before checking out.</p><div class="account-actions"><a class="btn btn-primary" href="shop.html">Browse canvases</a></div></section>';const subtotal=c.reduce((s,x)=>s+Number(x.price||0)*Math.max(1,Number(x.qty||1)),0);return '<div class="checkout-layout"><section class="account-card"><span class="eyebrow">CHECKOUT</span><h1>Delivery details</h1><p>Complete your details below. Your order will be created as pending until payment is connected.</p><form id="checkoutForm"><input name="full_name" required placeholder="Full name"><input name="email" type="email" required placeholder="Email address"><input name="phone" placeholder="Phone number"><input name="line1" required placeholder="Street address"><input name="line2" placeholder="Apartment, unit, complex (optional)"><input name="city" required placeholder="City"><input name="province" required placeholder="Province"><input name="postal_code" required placeholder="Postal code"><textarea name="notes" placeholder="Order notes (optional)"></textarea><div class="account-actions"><button class="btn btn-primary" type="submit">Place order</button><a class="btn btn-outline" href="cart.html">Back to cart</a></div><p id="checkoutMsg" class="account-msg"></p></form></section><section class="account-card"><span class="eyebrow">ORDER SUMMARY</span><h2>Your items</h2>'+c.map(x=>'<div class="checkout-item"><div><strong>'+esc(x.name)+'</strong><br><small>Qty: '+Math.max(1,Number(x.qty||1))+(x.sku?' · '+esc(x.sku):'')+'</small></div><strong>'+money(Number(x.price||0)*Math.max(1,Number(x.qty||1)))+'</strong></div>').join('')+'<div class="total-row"><strong>Total</strong><strong>'+money(subtotal)+'</strong></div></section></div>';}
async function renderAccount(user){
const p=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();const o=await db.from('orders').select('*').eq('user_id',user.id).order('created_at',{ascending:false});const profile=p.data||{};const orders=o.data||[];const name=profile.full_name||user.user_metadata?.full_name||user.email?.split('@')[0]||'Customer';
if(location.hash==='#checkout'){box.innerHTML=checkoutHTML();if(!getCart().length)return;const f=document.getElementById('checkoutForm');f.full_name.value=name;f.email.value=user.email||'';f.phone.value=profile.phone||'';f.onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('checkoutMsg');const c=getCart();if(!c.length){msg.textContent='Your cart is empty.';return}msg.textContent='Placing order…';const fd=new FormData(f);const items=c.map(x=>({product_id:x.product_id,variant_id:x.variant_id||null,quantity:Math.max(1,Number(x.qty||1))}));const r=await db.rpc('place_order',{p_items:items,p_shipping_address:{line1:fd.get('line1'),line2:fd.get('line2'),city:fd.get('city'),province:fd.get('province'),postal_code:fd.get('postal_code'),country:'South Africa'},p_customer_name:fd.get('full_name'),p_customer_email:fd.get('email'),p_customer_phone:fd.get('phone')});if(r.error){msg.className='account-msg error';msg.textContent=r.error.message;return}localStorage.removeItem(CART_KEY);updateCount();box.innerHTML='<section class="account-card success"><span class="eyebrow">ORDER RECEIVED</span><h1>Thank you for your order!</h1><p>Your order <strong>#'+esc(String(r.data).slice(0,8).toUpperCase())+'</strong> has been created and is currently pending.</p><p>Payment processing will be added next.</p><div class="account-actions"><a class="btn btn-primary" href="account.html">View account</a><a class="btn btn-outline" href="shop.html">Continue shopping</a></div></section>';};return}
box.innerHTML='<section class="account-card"><div style="display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap"><div><span class="eyebrow">YOUR ACCOUNT</span><h1>Welcome, '+esc(name)+'.</h1><p>'+esc(user.email)+'</p></div><button id="signOut" class="btn btn-outline">Sign out</button></div></section><div class="account-grid" style="margin-top:22px"><section class="account-card"><span class="eyebrow">PROFILE</span><h2>Your details</h2><form id="profileForm"><input name="full_name" value="'+esc(profile.full_name||name)+'" placeholder="Full name"><input name="phone" value="'+esc(profile.phone||'')+'" placeholder="Phone number"><div class="account-actions"><button class="btn btn-primary" type="submit">Save details</button></div><p id="profileMsg" class="account-msg"></p></form></section><section class="account-card"><span class="eyebrow">CART</span><h2>Ready to checkout?</h2><p>You have <strong>'+cartQty()+'</strong> item(s) in your cart.</p><div class="account-actions"><a class="btn btn-primary" href="account.html#checkout">Checkout</a><a class="btn btn-outline" href="cart.html">View cart</a></div></section></div><section class="account-card" style="margin-top:22px"><span class="eyebrow">ORDER HISTORY</span><h2>Your orders</h2>'+(orders.length?orders.map(x=>'<div class="order-item"><div><strong>#'+esc(x.id.slice(0,8).toUpperCase())+'</strong><br><small>'+new Date(x.created_at).toLocaleDateString('en-ZA')+'</small></div><span>'+esc(x.status||'pending')+'</span><strong>'+money(x.total)+'</strong></div>').join(''):'<p>No orders yet.</p>')+'</section>';
document.getElementById('signOut').onclick=async()=>{await db.auth.signOut();authUI()};document.getElementById('profileForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget),m=document.getElementById('profileMsg');const r=await db.from('profiles').upsert({id:user.id,full_name:fd.get('full_name'),phone:fd.get('phone')});m.textContent=r.error?'Could not save: '+r.error.message:'Details saved.'};}

authUI();
db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&session?.user)renderAccount(session.user);if(event==='SIGNED_OUT')authUI()});
db.auth.getSession().then(({data})=>{if(data?.session?.user)renderAccount(data.session.user)}).catch(console.warn);
})();
</script>
</body>
</html>
