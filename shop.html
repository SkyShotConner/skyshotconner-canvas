<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#030911"><title>Shop | SkyShotConner Canvas</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="site-overrides.css"><style>
.shop-page #products{grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;align-items:stretch}.shop-page .product-card{height:100%;min-width:0}.shop-page .shop-product-card{display:flex;flex-direction:column;height:100%;min-width:0;overflow:hidden;background:linear-gradient(145deg,rgba(13,31,47,.82),rgba(4,12,22,.76));border:1px solid rgba(99,215,255,.16);border-radius:24px;box-shadow:0 22px 70px rgba(0,0,0,.32);transition:transform .25s,border-color .25s,box-shadow .25s}.shop-page .shop-product-card:hover{transform:translateY(-5px);border-color:rgba(99,215,255,.42);box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 35px rgba(99,215,255,.08)}.shop-page .shop-product-image{display:block;position:relative;aspect-ratio:4/3;overflow:hidden;background:#071522}.shop-page .shop-product-image img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s ease}.shop-page .shop-product-card:hover .shop-product-image img{transform:scale(1.035)}.shop-page .shop-product-image:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(2,8,15,.48));pointer-events:none}.shop-page .shop-product-badge{position:absolute;z-index:2;top:12px;left:12px;padding:6px 9px;border-radius:999px;background:rgba(3,12,21,.72);border:1px solid rgba(99,215,255,.25);color:#8fe5ff;font-size:.58rem;font-weight:900;letter-spacing:.12em;backdrop-filter:blur(12px)}.shop-page .shop-product-info{padding:19px;display:flex;flex-direction:column;flex:1;min-width:0}.shop-page .shop-product-category{color:#63d7ff;font-size:.62rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.shop-page .shop-product-info h3{margin:7px 0 7px;font-size:1.15rem;line-height:1.12;letter-spacing:-.025em;color:#f0faff}.shop-page .shop-product-description{margin:0 0 14px;color:#91a9b8;font-size:.82rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.shop-page .shop-options{margin-top:auto;border:1px solid rgba(99,215,255,.12);border-radius:15px;background:rgba(255,255,255,.025);overflow:hidden}.shop-page .shop-options summary{list-style:none;cursor:pointer;padding:12px 13px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:#eaf7fc;font-size:.75rem;font-weight:850}.shop-page .shop-options summary::-webkit-details-marker{display:none}.shop-page .shop-options summary:after{content:"+";font-size:1.05rem;color:#63d7ff;transition:transform .2s}.shop-page .shop-options[open] summary:after{transform:rotate(45deg)}.shop-page .shop-options-summary{color:#91a9b8;font-size:.65rem;font-weight:600}.shop-page .shop-option-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:0 10px 10px}.shop-page .shop-option{display:flex;align-items:center;justify-content:space-between;gap:5px;padding:8px 9px;border:1px solid rgba(255,255,255,.075);border-radius:9px;background:rgba(255,255,255,.025);color:#dcecf2;font-size:.68rem;font-weight:750}.shop-page .shop-option strong{color:#fff;font-size:.67rem;white-space:nowrap}.shop-page .shop-option:hover{border-color:rgba(99,215,255,.35);background:rgba(99,215,255,.055)}.shop-page .shop-card-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}.shop-page .shop-from{font-size:.72rem;color:#91a9b8}.shop-page .shop-from strong{display:block;color:#fff;font-size:1.08rem}.shop-page .shop-view{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 13px;border-radius:11px;background:linear-gradient(135deg,#63d7ff,#8c9dff);color:#03101a;font-size:.7rem;font-weight:900;white-space:nowrap}.shop-page .shop-card-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;color:#718b99;font-size:.58rem}.shop-page .shop-size-note{padding:0 13px 11px;color:#718b99;font-size:.6rem;line-height:1.4}.shop-page .shop-product-link{display:block;color:inherit;text-decoration:none}.shop-page .shop-option{cursor:default}
@media(max-width:1100px){.shop-page #products{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}
@media(max-width:900px){.shop-page #products{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.shop-page .shop-product-info{padding:14px}.shop-page .shop-product-info h3{font-size:1rem}.shop-page .shop-product-description{font-size:.75rem}.shop-page .shop-card-footer{align-items:stretch;flex-direction:column}.shop-page .shop-view{width:100%}}
@media(max-width:560px){.shop-page #products{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.shop-page .shop-product-card{border-radius:17px}.shop-page .shop-product-image{aspect-ratio:4/3}.shop-page .shop-product-badge{top:7px;left:7px;padding:5px 7px;font-size:.47rem}.shop-page .shop-product-info{padding:10px}.shop-page .shop-product-category{font-size:.5rem}.shop-page .shop-product-info h3{font-size:.82rem;margin:5px 0}.shop-page .shop-product-description{font-size:.64rem;line-height:1.4;margin-bottom:9px;-webkit-line-clamp:2}.shop-page .shop-options summary{padding:9px;font-size:.6rem}.shop-page .shop-options-summary{font-size:.52rem}.shop-page .shop-option-grid{gap:4px;padding:0 6px 6px}.shop-page .shop-option{padding:6px 5px;font-size:.48rem}.shop-page .shop-option strong{font-size:.49rem}.shop-page .shop-size-note{padding:0 9px 8px;font-size:.49rem}.shop-page .shop-card-footer{margin-top:8px;gap:7px}.shop-page .shop-from{font-size:.52rem}.shop-page .shop-from strong{font-size:.78rem}.shop-page .shop-view{min-height:34px;font-size:.57rem;padding:0 8px}.shop-page .shop-card-meta{font-size:.47rem;margin-top:7px}}
</style></head><body class="shop-page"><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">✈</span><span>SkyShotConner <b>Canvas</b></span></a><button class="menu-toggle" type="button">☰</button><nav class="main-nav"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="account.html">Account</a><a class="cart-link" href="cart.html">Cart <span id="cartCount">0</span></a></nav></header><main class="page"><section class="shop-hero"><div class="container"><span class="eyebrow">SKYSHOTCONNER CANVAS</span><h1>The aviation collection.</h1><p>Original aircraft photography, presented as wall art.</p><div class="shop-toolbar"><input id="search" type="search" placeholder="Search aircraft, locations or collections…"><select id="categoryFilter"><option value="">All collections</option></select></div></div></section><section class="section" style="padding-top:35px"><div class="container"><div id="products" class="product-grid"><div class="loading-state"><div class="loader-plane">✈</div><p>Loading collection…</p></div></div></div></section></main><footer><strong>SkyShotConner Canvas</strong><small>© <span id="year"></span></small></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>
(function(){
  const sizes=[['A5',349],['A4',449],['A3',549],['A2',749],['A1',1099],['A0',1799]];
  function enhance(){
    const root=document.querySelector('#products');
    if(!root)return false;
    const cards=[...root.querySelectorAll('.product-card')].filter(c=>!c.dataset.shopEnhanced);
    if(!cards.length)return false;
    cards.forEach(card=>{
      const link=card.querySelector('.product-link');
      if(!link)return;
      const href=link.getAttribute('href')||'product.html';
      const imgEl=card.querySelector('.product-image img');
      const imgHtml=imgEl?`<img src="${imgEl.getAttribute('src')||''}" alt="${imgEl.getAttribute('alt')||''}" loading="lazy">`:'<span aria-hidden="true">✈</span>';
      const name=card.querySelector('h3')?.textContent?.trim()||'Aviation Canvas';
      const desc=card.querySelector('.product-description')?.textContent?.trim()||'Fine-art aviation photography printed for your wall.';
      const category=card.querySelector('.product-card-meta span')?.textContent?.trim()||'Aviation Photography';
      const sku=card.querySelector('.product-card-meta span:nth-child(2)')?.textContent?.trim()||'';
      const badge=card.querySelector('.product-badge')?.textContent?.trim()||'AVIATION CANVAS';
      card.className='shop-product-card';
      card.dataset.shopEnhanced='1';
      card.innerHTML=`<a class="shop-product-link" href="${href}" onclick="sessionStorage.setItem('ssc_return_url',location.pathname+location.search+location.hash)"><div class="shop-product-image">${imgHtml}<span class="shop-product-badge">${badge}</span></div></a><div class="shop-product-info"><span class="shop-product-category">${category}</span><h3>${name}</h3><p class="shop-product-description">${desc}</p><details class="shop-options"><summary><span>Choose canvas size</span><span class="shop-options-summary">6 standard sizes</span></summary><div class="shop-option-grid">${sizes.map(([s,p])=>`<div class="shop-option"><span>${s}</span><strong>R ${p.toLocaleString('en-ZA')}</strong></div>`).join('')}</div><div class="shop-size-note">Select your size on the product page before adding to cart.</div></details><div class="shop-card-footer"><div class="shop-from">Starting from<strong>R 349</strong></div><a class="shop-view" href="${href}" onclick="sessionStorage.setItem('ssc_return_url',location.pathname+location.search+location.hash)">View canvas</a></div>${sku?`<div class="shop-card-meta"><span>${sku}</span><span>Courier Guy nationwide</span></div>`:''}</div>`;
    });
    return true;
  }
  let tries=0;const timer=setInterval(()=>{tries++;if(enhance()||tries>40)clearInterval(timer)},100);setTimeout(enhance,0);
})();
</script></body></html>
