<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Shop SkyShotConner aviation canvas prints.">
<title>Shop — SkyShotConner Canvas</title>
<link rel="stylesheet" href="styles.css">
<style>
.shop-error{padding:2rem;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(255,255,255,.04);text-align:center}.shop-error h3{margin-bottom:.5rem}.shop-error p{opacity:.75}.product-card{min-height:100%;}.product-image{min-height:220px;display:flex;align-items:center;justify-content:center}.product-image.no-photo{font-size:4rem;opacity:.35}.product-image img{width:100%;height:100%;object-fit:cover}.shop-loading{padding:3rem;text-align:center;opacity:.75}
</style>
</head>
<body>
<div id="loader" class="page-loader"><div class="loader-plane">✈</div><span>Loading collection…</span></div>
<header class="site-header">
<a class="brand" href="index.html"><span class="brand-mark">✈</span><span>SkyShotConner <b>Canvas</b></span></a>
<button class="menu-toggle" aria-label="Open menu">☰</button>
<nav class="main-nav"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="account.html">Account</a><a class="cart-link" href="cart.html">Cart <span id="cartCount">0</span></a></nav>
</header>
<main class="page">
<span class="eyebrow">THE COLLECTION</span>
<h1>Aviation canvases.</h1>
<div class="toolbar"><p>Original aviation photography made for your wall.</p><div class="shop-filters"><input class="search" id="search" placeholder="Search aircraft, collection…"><select class="search" id="categoryFilter"><option value="">All collections</option></select></div></div>
<div id="products" class="product-grid"><div class="shop-loading">Loading products…</div></div>
</main>
<footer><div><strong>SkyShotConner Canvas</strong><p>Aviation photography. Printed to display.</p></div><div><a href="shop.html">Shop</a><a href="account.html">Account</a><a href="cart.html">Cart</a></div><small>© <span id="year"></span></small></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';
const URL='https://xdkoutuetajwzwrjzehw.supabase.co';
const KEY='sb_publishable_K0r7cxL94PMJ5S0HM8aKfQ_cc73t2hu';
const db=window.supabase.createClient(URL,KEY);
const productsEl=document.getElementById('products');
const searchEl=document.getElementById('search');
const categoryEl=document.getElementById('categoryFilter');
const loader=document.getElementById('loader');
const esc=v=>String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const money=v=>'R '+Number(v||0).toLocaleString('en-ZA',{minimumFractionDigits:2});
function hideLoader(){if(!loader)return;loader.style.opacity='0';loader.style.pointerEvents='none';setTimeout(()=>loader.remove(),250)}
function updateCart(){try{const c=JSON.parse(localStorage.getItem('ssc_canvas_cart')||'[]');document.getElementById('cartCount').textContent=c.reduce((n,x)=>n+Number(x.qty||1),0)}catch{}}
function card(p){return `<article class="product-card"><a class="product-link" href="product.html?id=${encodeURIComponent(p.id)}"><div class="product-image no-photo">✈</div><div class="product-info"><span class="product-badge">${p.is_featured?'FEATURED':'AVIATION CANVAS'}</span><h3>${esc(p.name)}</h3><p>${esc(p.short_description||p.description||'Premium aviation photography printed for display.')}</p><span class="price">${money(p.price)}</span></div></a></article>`}
async function loadCategories(){const r=await db.from('categories').select('id,name').eq('is_active',true).order('sort_order');if(!r.error&&categoryEl)categoryEl.innerHTML='<option value="">All collections</option>'+(r.data||[]).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}
async function draw(){
productsEl.innerHTML='<div class="shop-loading">Loading products…</div>';
try{
let q=db.from('products').select('id,category_id,name,description,short_description,price,stock,sku,is_active,is_featured,created_at').eq('is_active',true).order('created_at',{ascending:false});
if(categoryEl.value)q=q.eq('category_id',categoryEl.value);
const r=await q;
if(r.error)throw r.error;
let list=r.data||[];
const term=(searchEl.value||'').trim().toLowerCase();
if(term)list=list.filter(p=>(p.name+' '+(p.description||'')+' '+(p.short_description||'')).toLowerCase().includes(term));
productsEl.innerHTML=list.length?list.map(card).join(''):`<div class="shop-error"><h3>No canvases found</h3><p>There are currently no matching products.</p></div>`;
}catch(err){console.error('Shop load error:',err);productsEl.innerHTML='<div class="shop-error"><h3>Could not load the shop</h3><p>The shop connected, but the product request failed. Please refresh the page.</p></div>'}
finally{hideLoader()}
}
loadCategories().catch(console.error).finally(draw);
searchEl.addEventListener('input',()=>{clearTimeout(window.__shopTimer);window.__shopTimer=setTimeout(draw,250)});
categoryEl.addEventListener('change',draw);
updateCart();
document.getElementById('year').textContent=new Date().getFullYear();
setTimeout(hideLoader,5000);
})();
</script>
</body>
</html>
